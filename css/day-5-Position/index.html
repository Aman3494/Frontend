<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <style>
        .relative {
            position: relative;
        }

        .absolute {
            position: absolute;
            top: 191px;
            right: 100px;
        }

        .absolute p {
            max-width: 400px;
        }

        .absolute {
            padding: 20px;
            border-radius: 20px;
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <div class="relative">
        <img src="./assets/image/banner.jpg" alt="img">
    </div>
    <div class="absolute">
        <h2>Dholpur</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse similique, soluta iste quasi nulla accusamus
            rem corporis rerum praesentium, culpa saepe quaerat perspiciatis iusto quisquam aspernatur unde vitae
            expedita et.</p>
    </div>
</body>

</html>
