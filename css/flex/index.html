<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box</title>
    <style>
        .parent{
            width: 1000px;
            height: 500px;
            border: 2px solid black;
        }

        .parent{
            display: flex;
            justify-content: center;
            justify-content: space-evenly;
            flex-direction:column-reverse
        }
        .child{
            width: 100px;
            height: 100px;
            border: 2px solid red;
        }
    </style>
</head>

<body>
    <div class="parent">
        <h2 class="child">1</h2>
        <h2 class="child">2</h2>
        <h2 class="child">3</h2>
        <h2 class="child">4</h2>
        <h2 class="child">5</h2>
    </div>
</body>

</html>
