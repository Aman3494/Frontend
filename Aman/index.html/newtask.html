<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 15px;
            margin: 10px;
            width: 300px;
        }

        table {
            border-collapse: collapse;
            width: 50%;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Personal Details</h2>
        <p>Name: Aman</p>
        <p>Course: B.Com</p>
        <p>City: Dholpur</p>
    </div>

    <div class="box">
        <h2>Contact </h2>
        <p>Email: aman@email.com</p>
        <p>Phone: 1234567890</p>
        
    </div>

    <table>
        <tr>
               <th>Name</th>
            <th>Address</th>
        </tr>
        <tr>
            <td>Aman</td>
            <td>Dholpur, Rajasthan</td>
        </tr>
        
    </table>

</body>
</html>
