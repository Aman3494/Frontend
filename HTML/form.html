<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial;
      margin: 30px;
    }
    form {
      max-width: 450px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .gender, .interests {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .gender input, .interests input {
      width: auto;
    }
    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }
    .terms {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2 align="center">User Registration Form</h2>

  <form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">

    <label>Gender:</label>
    <div class="gender">
      <label><input type="radio" name="gender" value="male"> Male</label>
      <label><input type="radio" name="gender" value="female"> Female</label>
      <label><input type="radio" name="gender" value="other"> Other</label>
    </div>

    <label>Interests:</label>
    <div class="interests">
      <label><input type="checkbox" name="interest" value="java"> Java</label>
      <label><input type="checkbox" name="interest" value="python"> Python</label>
      <label><input type="checkbox" name="interest" value="c"> C</label>
    </div>

    <label for="country">Country:</label>
    <select id="country" name="country">
      <option value="">-- Select Country --</option>
      <option value="india">India</option>
      <option value="usa">USA</option>
      <option value="uk">UK</option>
      <option value="canada">Canada</option>
      <option value="australia">Australia</option>
    </select>

    <label for="image">Upload Image:</label>
    <input type="file" id="image" name="image" accept="image/*">

    <label for="bio">Bio:</label>
    <textarea id="bio" name="bio" rows="4" placeholder="Tell us something about yourself..."></textarea>

    <div class="terms">
      <label><input type="checkbox" required> I agree to the Terms and Conditions</label>
    </div>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
